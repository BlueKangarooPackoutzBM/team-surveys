<title>Blue Kangaroo Packoutz™ © 2026 Team Survey. All rights reserved.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --blue:#0068b2;
    --blue-dark:#004e85;
    --blue-deep:#003a63;
    --sky:#00b6ee;
    --sky-soft:#e3f6fd;
    --gold:#f5a800;
    --gold-soft:#fff4d6;
    --ink:#14232e;
    --ink-soft:#43565f;
    --bg:#f2f7fa;
    --card:#ffffff;
    --line:#d7e5ec;
    --danger:#b3261e;
    --danger-bg:#fdeceb;
    --ok:#177245;
    --ok-bg:#e6f4ec;
    --shadow:0 2px 10px rgba(0,58,99,.08), 0 10px 30px rgba(0,58,99,.06);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eaf3f8;
      --ink-soft:#a9bfca;
      --bg:#0b1a24;
      --card:#122936;
      --line:#24414f;
      --sky-soft:#0e3448;
      --gold-soft:#3a2f0e;
      --danger-bg:#3d1714;
      --ok-bg:#123324;
      --shadow:0 2px 10px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    font-size:17px;
  }
  button{ font-family:inherit; cursor:pointer; }
  input, textarea, select{ font-family:inherit; }

  /* ---------- Header ---------- */
  header.topbar{
    background:linear-gradient(135deg, var(--blue-deep) 0%, var(--blue) 62%, #0a7fc4 100%);
    color:#fff;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px)*0);
    position:sticky; top:0; z-index:40;
    box-shadow:0 2px 12px rgba(0,40,70,.25);
  }
  .topbar-inner{ max-width:760px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .brand{ display:flex; align-items:center; gap:11px; min-width:0; flex:1; }
  .brand .brand-logo{
    width:44px; height:44px; flex:0 0 44px;
    background:#fff; border-radius:12px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px var(--gold);
  }
  .brand .brand-logo img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .brand > div{ min-width:0; }
  .brand h1{ font-size:19px; font-weight:900; margin:0; letter-spacing:.2px; line-height:1.2; overflow-wrap:break-word; }
  @media (max-width:560px){
    .brand h1{ font-size:15px; line-height:1.25; }
    .topbar-inner{ align-items:flex-start; }
    .brand .brand-logo{ margin-top:2px; }
  }
  .brand p{ margin:1px 0 0; font-size:12.5px; font-weight:700; color:#bfe8fa; letter-spacing:.4px; text-transform:uppercase; }
  .lang-toggle{
    display:flex; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.45);
    border-radius:999px; padding:3px; flex:0 0 auto;
  }
  .lang-toggle button{
    border:0; background:transparent; color:#fff; font-weight:800; font-size:14px;
    padding:7px 14px; border-radius:999px; min-height:38px;
  }
  .lang-toggle button.active{ background:#fff; color:var(--blue-dark); }

  /* ---------- Progress ---------- */
  .progress-wrap{
    background:var(--card); border-bottom:1px solid var(--line);
    position:sticky; top:74px; z-index:30;
  }
  .progress-inner{ max-width:760px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px; }
  .progress-track{ flex:1; height:10px; background:var(--line); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--sky), var(--blue)); border-radius:99px; transition:width .35s ease; }
  .progress-label{ font-size:13.5px; font-weight:800; color:var(--ink-soft); white-space:nowrap; }

  main{ max-width:760px; margin:0 auto; padding:22px 16px 60px; }

  /* ---------- Cards & screens ---------- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:24px 20px; margin-bottom:18px;
  }
  .center-card{ text-align:center; padding:36px 24px; }
  .center-card .roo-big{ margin:0 auto 14px; width:150px; height:143px; max-width:55vw; border-radius:18px; overflow:hidden; }
  .center-card .roo-big img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .center-card h2{ font-size:25px; font-weight:900; margin:6px 0 10px; line-height:1.25; }
  .center-card p{ color:var(--ink-soft); font-size:16.5px; margin:0 auto 8px; max-width:520px; }
  .spinner{
    width:44px; height:44px; margin:10px auto; border-radius:50%;
    border:5px solid var(--line); border-top-color:var(--blue);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @media (prefers-reduced-motion: reduce){
    .spinner{ animation-duration:2.5s; }
    .progress-fill{ transition:none; }
  }

  .survey-intro h2{ font-size:24px; font-weight:900; margin:0 0 12px; line-height:1.3; color:var(--blue-dark); }
  @media (prefers-color-scheme: dark){ .survey-intro h2{ color:var(--sky); } }
  .survey-intro p{ font-size:16.5px; color:var(--ink); margin:0; white-space:pre-line; }
  .anon-strip{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--sky-soft); border-radius:12px; padding:12px 14px; margin-top:16px;
    font-size:14.5px; font-weight:700; color:var(--blue-deep);
  }
  @media (prefers-color-scheme: dark){ .anon-strip{ color:#bfe8fa; } }
  .anon-strip svg{ flex:0 0 22px; margin-top:1px; }

  /* ---------- Question blocks ---------- */
  .part-head{ margin:26px 2px 12px; }
  .part-head h3{ font-size:19px; font-weight:900; margin:0; color:var(--blue-dark); }
  @media (prefers-color-scheme: dark){ .part-head h3{ color:var(--sky); } }
  .scale-legend{
    margin-top:6px; font-size:13.5px; font-weight:700; color:var(--ink-soft);
    background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:8px 12px;
  }
  .scale-legend b{ color:var(--ink); }
  .part-note{ font-size:14.5px; font-weight:700; color:var(--ink-soft); margin-top:6px; }

  .q-card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:18px 16px; margin-bottom:14px; box-shadow:var(--shadow);
    scroll-margin-top:150px;
  }
  .q-card.missing{ border-color:var(--danger); background:var(--danger-bg); }
  .q-text{ font-size:17px; font-weight:800; margin:0 0 14px; line-height:1.45; }
  .q-text .qnum{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:28px; height:28px; padding:0 6px; margin-right:8px;
    background:var(--blue); color:#fff; border-radius:9px; font-size:14px; font-weight:900;
    vertical-align:2px;
  }

  /* Likert */
  .likert{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .likert button{
    border:2px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:13px; min-height:58px; padding:6px 2px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    transition:border-color .12s, background .12s;
  }
  .likert button .n{ font-size:21px; font-weight:900; line-height:1; }
  .likert button .w{ font-size:10.5px; font-weight:800; color:var(--ink-soft); line-height:1.15; text-align:center; }
  .likert button.selected{ background:var(--blue); border-color:var(--blue-dark); color:#fff; box-shadow:0 0 0 3px var(--gold); }
  .likert button.selected .w{ color:#d9f2fd; }
  .likert button:active{ transform:scale(.97); }

  /* Choice rows (pick-two + single) */
  .choice-list{ display:flex; flex-direction:column; gap:9px; }
  .choice-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    border:2px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:13px; padding:14px 14px; min-height:56px;
    font-size:16px; font-weight:700; line-height:1.35;
  }
  .choice-row .box{
    flex:0 0 26px; width:26px; height:26px; border:2.5px solid var(--ink-soft);
    border-radius:7px; display:flex; align-items:center; justify-content:center;
    background:var(--card); color:#fff; font-size:16px; font-weight:900;
  }
  .choice-row.radio .box{ border-radius:50%; }
  .choice-row.selected{ border-color:var(--blue); background:var(--sky-soft); }
  .choice-row.selected .box{ background:var(--blue); border-color:var(--blue-dark); }
  .choice-row:active{ transform:scale(.99); }
  .pick-hint{ font-size:13.5px; font-weight:800; color:var(--ink-soft); margin:0 0 10px; }

  textarea{
    width:100%; min-height:96px; resize:vertical;
    border:2px solid var(--line); border-radius:13px; background:var(--bg); color:var(--ink);
    padding:13px 14px; font-size:16px; line-height:1.45;
  }
  textarea:focus, input[type="text"]:focus{ outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(0,182,238,.25); }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:0; border-radius:14px; font-weight:900; font-size:17px;
    padding:16px 22px; min-height:58px; text-decoration:none;
  }
  .btn-primary{ background:var(--blue); color:#fff; box-shadow:0 6px 18px rgba(0,104,178,.35); width:100%; }
  .btn-primary:active{ background:var(--blue-dark); }
  .btn-primary:disabled{ background:#9db8c6; box-shadow:none; cursor:not-allowed; }
  .btn-gold{ background:var(--gold); color:#3a2a00; }
  .btn-ghost{ background:transparent; color:var(--blue); border:2px solid var(--blue); }
  @media (prefers-color-scheme: dark){ .btn-ghost{ color:var(--sky); border-color:var(--sky); } }
  .btn-small{ padding:10px 16px; min-height:46px; font-size:15px; border-radius:11px; width:auto; }
  .submit-zone{ margin-top:26px; }
  .submit-zone .fineprint{ text-align:center; font-size:13.5px; color:var(--ink-soft); font-weight:700; margin-top:12px; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%, 140%); z-index:100;
    background:var(--blue-deep); color:#fff; font-weight:800; font-size:15.5px;
    padding:14px 20px; border-radius:13px; max-width:min(92vw,560px); text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35); transition:transform .3s ease, visibility 0s .3s;
    visibility:hidden; pointer-events:none;
  }
  #toast.show{ transform:translate(-50%, 0); visibility:visible; transition:transform .3s ease; }
  #toast.error{ background:var(--danger); }

  .offline-banner{
    background:var(--gold-soft); border:1.5px solid var(--gold); color:#5c4300;
    border-radius:12px; padding:13px 15px; font-weight:800; font-size:15px; margin-bottom:16px;
  }
  @media (prefers-color-scheme: dark){ .offline-banner{ color:#ffd968; } }

  footer.pagefoot{
    text-align:center; color:var(--ink-soft); font-size:13px; font-weight:700;
    padding:8px 16px 30px;
  }
  .territory-line{ font-size:13.5px; font-weight:900; color:var(--blue-dark); letter-spacing:.2px; }
  @media (prefers-color-scheme: dark){ .territory-line{ color:var(--sky); } }
  .property-line{ font-size:12.5px; font-weight:700; color:var(--ink-soft); }
  .center-card .territory-line{ margin:0 auto 2px; }
  .center-card .property-line{ margin:0 auto 10px; }

  /* ---------- Admin ---------- */
  .admin-badge{
    display:inline-block; background:var(--gold); color:#3a2a00; font-weight:900;
    font-size:12.5px; letter-spacing:.6px; padding:4px 11px; border-radius:99px; text-transform:uppercase;
  }
  .admin h2{ font-size:22px; font-weight:900; margin:14px 0 6px; }
  .admin h3{ font-size:18px; font-weight:900; margin:0 0 10px; color:var(--blue-dark); }
  @media (prefers-color-scheme: dark){ .admin h3{ color:var(--sky); } }
  .admin .sub{ color:var(--ink-soft); font-size:15px; margin:0 0 14px; }
  .field-label{ display:block; font-weight:800; font-size:14.5px; margin:0 0 7px; }
  input[type="text"]{
    width:100%; border:2px solid var(--line); border-radius:13px; background:var(--bg); color:var(--ink);
    padding:14px; font-size:16.5px; min-height:56px;
  }
  .survey-pick{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:6px 0 16px; }
  @media (max-width:520px){ .survey-pick{ grid-template-columns:1fr; } }
  .survey-pick button{
    border:2.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:14px;
    padding:16px 14px; text-align:left; min-height:76px;
  }
  .survey-pick button .t{ display:block; font-size:17px; font-weight:900; }
  .survey-pick button .d{ display:block; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-top:3px; }
  .survey-pick button.selected{ border-color:var(--blue); background:var(--sky-soft); box-shadow:0 0 0 3px var(--gold); }
  .link-box{
    background:var(--bg); border:1.5px dashed var(--blue); border-radius:12px;
    padding:13px 14px; font-size:14.5px; font-weight:700; word-break:break-all; margin:10px 0;
  }
  .msg-box{
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; font-size:14.5px; white-space:pre-wrap; margin:8px 0 14px; line-height:1.5;
  }
  .msg-label{ font-size:12.5px; font-weight:900; letter-spacing:.5px; text-transform:uppercase; color:var(--ink-soft); margin-top:14px; }
  .assign-row{
    display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .assign-row:last-child{ border-bottom:0; }
  .assign-row .who{ flex:1; min-width:0; }
  .assign-row .who .nm{ font-weight:900; font-size:16px; }
  .assign-row .who .tp{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .status-pill{ font-size:12.5px; font-weight:900; padding:5px 11px; border-radius:99px; white-space:nowrap; }
  .status-pill.waiting{ background:var(--gold-soft); color:#7a5600; border:1px solid var(--gold); }
  .status-pill.done{ background:var(--ok-bg); color:var(--ok); border:1px solid var(--ok); }
  @media (prefers-color-scheme: dark){ .status-pill.waiting{ color:#ffd968; } }

  .result-q{ padding:14px 0; border-bottom:1px solid var(--line); }
  .result-q:last-child{ border-bottom:0; }
  .result-q .rq-text{ font-weight:800; font-size:15.5px; margin:0 0 8px; }
  .result-q .rq-avg{ font-size:13.5px; font-weight:800; color:var(--ink-soft); margin-bottom:8px; }
  .dist{ display:flex; height:20px; border-radius:7px; overflow:hidden; background:var(--line); }
  .dist > div{ height:100%; }
  .dist .d1{ background:#d9534f; } .dist .d2{ background:#f0ad4e; } .dist .d3{ background:#b9c6cc; }
  .dist .d4{ background:#5bc0de; } .dist .d5{ background:var(--blue); }
  .dist-legend{ display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--ink-soft); margin-top:5px; }
  .opt-row{ display:flex; align-items:center; gap:10px; margin:7px 0; font-size:14.5px; font-weight:700; }
  .opt-row .opt-name{ flex:0 0 46%; }
  .opt-row .opt-bar{ flex:1; height:14px; background:var(--line); border-radius:6px; overflow:hidden; }
  .opt-row .opt-bar > div{ height:100%; background:var(--blue); }
  .opt-row .opt-count{ flex:0 0 30px; text-align:right; font-weight:900; }
  @media (max-width:520px){ .opt-row .opt-name{ flex-basis:52%; } }
  .lock-note{
    background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:12px;
    padding:15px 16px; font-weight:800; font-size:15.5px; color:#5c4300;
  }
  @media (prefers-color-scheme: dark){ .lock-note{ color:#ffd968; } }
  .protect-note{
    background:var(--sky-soft); border-radius:12px; padding:13px 15px;
    font-size:14.5px; font-weight:700; color:var(--blue-deep); margin-top:14px;
  }
  @media (prefers-color-scheme: dark){ .protect-note{ color:#bfe8fa; } }
  .empty-note{ color:var(--ink-soft); font-weight:700; font-size:15px; padding:8px 0; }
  .hidden{ display:none !important; }
  /* ---------- Custom surveys / builder ---------- */
  .survey-list-row{ display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line); }
  .survey-list-row:last-child{ border-bottom:0; }
  .survey-list-row .sl-who{ flex:1; min-width:0; }
  .survey-list-row .sl-name{ font-weight:900; font-size:16px; line-height:1.3; }
  .survey-list-row .sl-meta{ font-size:13px; font-weight:700; color:var(--ink-soft); }
  .type-pill{ font-size:12px; font-weight:900; padding:5px 10px; border-radius:99px; white-space:nowrap; border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); }
  .type-pill.custom{ background:var(--sky-soft); color:var(--blue-dark); border-color:var(--sky); }
  @media (prefers-color-scheme: dark){ .type-pill.custom{ color:#bfe8fa; } }
  select.builder-select{
    width:100%; border:2px solid var(--line); border-radius:13px; background:var(--bg); color:var(--ink);
    padding:13px 14px; font-size:16.5px; min-height:56px; font-family:inherit; font-weight:700;
  }
  select.builder-select:focus{ outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(0,182,238,.25); }
  .builder-q{
    border:1.5px solid var(--line); border-radius:14px; padding:16px 14px; margin:14px 0; background:var(--bg);
  }
  .builder-q-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .builder-q-head strong{ font-size:16px; font-weight:900; }
  .builder-field{ margin-bottom:12px; }
  .builder-field label{ display:block; font-weight:800; font-size:13.5px; margin:0 0 6px; color:var(--ink-soft); }
  .builder-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .builder-actions .btn{ flex:1 1 auto; }
  .opt-editor-row{ display:flex; flex-direction:column; gap:8px; border:1px dashed var(--line); border-radius:12px; padding:11px; margin-bottom:9px; background:var(--card); }
  .opt-editor-row .opt-row-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .opt-editor-row .opt-row-top span{ font-weight:900; font-size:13.5px; color:var(--ink-soft); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border:2px solid var(--danger); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-danger:disabled{ background:#9db8c6; cursor:not-allowed; }
  .modal-overlay{
    position:fixed; inset:0; z-index:110; background:rgba(10,30,45,.55);
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-card{
    background:var(--card); color:var(--ink); border-radius:16px; box-shadow:var(--shadow);
    width:100%; max-width:460px; padding:24px 20px;
  }
  .modal-q{ font-size:19px; font-weight:900; margin:0 0 10px; line-height:1.35; }
  .modal-body{ font-size:15.5px; color:var(--ink-soft); margin:0 0 10px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }
  .req-toggle{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; padding:10px 0 2px; cursor:pointer; }
  .req-toggle input[type="checkbox"]{ width:24px; height:24px; flex:0 0 24px; accent-color:var(--blue); }
  .builder-divider{ border:0; border-top:1px solid var(--line); margin:18px 0; }
  textarea.builder-intro{ min-height:76px; }
</style>
</head>

function isCustomId(id) { return typeof id === "string" && id.indexOf("c-") === 0; }
function loadLocalCustomSurveys() {
  try {
    var raw = localStorage.getItem("custom-surveys");
    if (!raw) return [];
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed.filter(function (d) { return d && d.id; }) : [];
  } catch (e) { return []; }
}
function saveLocalCustomSurveys(list) {
  try { localStorage.setItem("custom-surveys", JSON.stringify(list)); } catch (e) {}
}
function localizedField(field, fallbackLang) {
  if (!field) return "";
  var v = field[lang];
  if (v && String(v).trim()) return v;
  if (field.en && String(field.en).trim()) return field.en;
  return v || "";
}
function normalizedQuestionsFromDefinition(def) {
  if (!def || !Array.isArray(def.questions)) return [];
  return def.questions.map(function (q, idx) {
    var type = q.type === "multi2" ? "picktwo" : q.type;
    var options = null;
    if (Array.isArray(q.options) && q.options.length) {
      options = {
        en: q.options.map(function (o) { return o.en || ""; }),
        es: q.options.map(function (o) { return (o.es && String(o.es).trim()) ? o.es : (o.en || ""); })
      };
    }
    return {
      id: "q" + (idx + 1),
      type: type,
      rawType: q.type,
      required: !!q.required,
      text: {
        en: (q.text && q.text.en) || "",
        es: (q.text && q.text.es && String(q.text.es).trim()) ? q.text.es : ((q.text && q.text.en) || "")
      },
      options: options,
      max: type === "picktwo" ? 2 : undefined
    };
  });
}
function currentQuestions() {
  if (isCustomId(currentSurvey) && customSurveyDef) return normalizedQuestionsFromDefinition(customSurveyDef);
  if (currentSurvey && SURVEYS[currentSurvey]) return allQuestions(currentSurvey);
  return [];
}
function genCustomId() {
  var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  var out = "c-";
  var buf = new Uint8Array(6);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(buf);
    for (var i = 0; i < 6; i++) out += chars[buf[i] % chars.length];
  } else {
    for (var j = 0; j < 6; j++) out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}

function t() { return UI[lang]; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function allQuestions(surveyId) {
  var out = [];
  SURVEYS[surveyId].parts.forEach(function (p) { p.questions.forEach(function (q) { out.push(q); }); });
  return out;
}

/* ---------------- JSONP + POST helpers ---------------- */
var jsonpCounter = 0;
function jsonp(url) {
  return new Promise(function (resolve, reject) {
    var cbName = "__surveyCb" + (++jsonpCounter) + "_" + Date.now();
    var script = document.createElement("script");
    var timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (data) { cleanup(); resolve(data); };
    script.onerror = function () { cleanup(); reject(new Error("network")); };
    script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cbName;
    document.head.appendChild(script);
  });
}
function checkCode(code) {
  return jsonp(SURVEY_API_URL + "?check=" + encodeURIComponent(code));
}
function postBridge(payload) {
  return fetch(SURVEY_API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  });
}

/* ============================================================
   RESPONDENT FLOW
   ============================================================ */
function init() {
  applyLangChrome();
  if (ADMIN_KEY) { renderAdmin(); return; }
  if (!CODE) { centerScreen("infoTitle", "infoBody", true); return; }

  /* Device one-time flag */
  try {
    if (localStorage.getItem("done:" + CODE)) { centerScreen("usedTitle", "usedBody", true); return; }
  } catch (e) {}

  if (!SURVEY_API_URL) { centerScreen("notReadyTitle", "notReadyBody", true); return; }

  /* If a submission is queued on this device, try to send it first */
  var pending = null;
  try { pending = localStorage.getItem("pending:" + CODE); } catch (e) {}
  if (pending) {
    loadingScreen();
    trySendPending(CODE, JSON.parse(pending)).then(function (done) {
      if (done) { centerScreen("thanksTitle", "thanksBody", true); }
      else { centerScreen("offlineSavedTitle", "offlineSavedBody", true); }
    });
    return;
  }

  loadingScreen();
  checkCode(CODE).then(function (res) {
    if (!res || !res.ok) { centerScreen("invalidTitle", "invalidBody", true); return; }
    if (res.used) {
      try { localStorage.setItem("done:" + CODE, "1"); } catch (e) {}
      centerScreen("usedTitle", "usedBody", true); return;
    }
    if (isCustomId(res.survey)) {
      if (!res.definition || !Array.isArray(res.definition.questions) || !res.definition.questions.length) { centerScreen("invalidTitle", "invalidBody", true); return; }
      customSurveyDef = res.definition;
      currentSurvey = res.survey;
      answers = {};
      renderSurvey();
      return;
    }
    if (res.survey !== "crew" && res.survey !== "exit") { centerScreen("invalidTitle", "invalidBody", true); return; }
    customSurveyDef = null;
    currentSurvey = res.survey;
    answers = {};
    renderSurvey();
  }).catch(function () {
    centerScreen("errTitle", "errBody", true);
  });
}

  var S;

    var cTitle = localizedField(customSurveyDef.title);

      parts: [{ title: { en: "", es: "" }, questions: normalizedQuestionsFromDefinition(customSurveyDef) }]
    };
    /* Use current lang values directly (already localized with fallback) */
    S.intro[lang] = { title: cTitle, body: cIntro };
  } else {
    S = SURVEYS[currentSurvey];
  }
  var html = "";
  /* Queued banner if offline */

function updateProgress() {
  if (!currentSurvey) return;
  var qs = currentQuestions().filter(function (q) { return q.required; });
  var done = 0;
  qs.forEach(function (q) {
    var v = answers[q.id];
    if (q.type === "picktwo") { if (v && v.length >= 1) done++; }
    else if (v !== undefined && v !== null && v !== "") done++;
  });
  var pct = qs.length ? Math.round((done / qs.length) * 100) : 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = done + " / " + qs.length + " " + t().answered;
}

function clearMissing(qid) {
  var card = document.getElementById("card-" + qid);
  if (card) card.classList.remove("missing");
}

function wireSurveyEvents() {
  app.querySelectorAll("[data-likert]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var qid = btn.getAttribute("data-likert");
      answers[qid] = parseInt(btn.getAttribute("data-val"), 10);
      var group = btn.parentNode.querySelectorAll("button");
      group.forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("selected", on);
        b.setAttribute("aria-checked", on ? "true" : "false");
      });
      clearMissing(qid);
      updateProgress();
    });
  });
  app.querySelectorAll("[data-pick]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var qid = btn.getAttribute("data-pick");
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var arr = answers[qid] ? answers[qid].slice() : [];
      var pos = arr.indexOf(idx);
      if (pos >= 0) { arr.splice(pos, 1); }
      else {
        if (arr.length >= 2) { toast(t().pickMaxToast, true); return; }
        arr.push(idx);
      }
      answers[qid] = arr;
      var q = null;
      currentQuestions().forEach(function (x) { if (x.id === qid) q = x; });
      var card = document.getElementById("card-" + qid);
      card.querySelectorAll("[data-pick]").forEach(function (b) {
        var i = parseInt(b.getAttribute("data-idx"), 10);
        var on = arr.indexOf(i) >= 0;
        b.classList.toggle("selected", on);
        b.querySelector(".box").textContent = on ? "✓" : "";
      });
      var pc = document.getElementById("pickcount-" + qid);
      if (pc) pc.textContent = "(" + arr.length + "/2)";
      if (arr.length >= 1) clearMissing(qid);
      updateProgress();
    });
  });
  app.querySelectorAll("[data-single]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var qid = btn.getAttribute("data-single");
      answers[qid] = parseInt(btn.getAttribute("data-idx"), 10);
      var card = document.getElementById("card-" + qid);
      card.querySelectorAll("[data-single]").forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("selected", on);
        b.querySelector(".box").textContent = on ? "●" : "";
      });
      clearMissing(qid);
      updateProgress();
    });
  });
  app.querySelectorAll("[data-text]").forEach(function (ta) {
    ta.addEventListener("input", function () { answers[ta.getAttribute("data-text")] = ta.value; });
  });
  var sb = document.getElementById("submitBtn");
  if (sb) sb.addEventListener("click", onSubmit);
}

function validate() {
  var missing = [];
  currentQuestions().forEach(function (q) {
    if (!q.required) return;
    var v = answers[q.id];
    var bad = false;
    if (q.type === "picktwo") bad = !(v && v.length >= 1);
    else bad = (v === undefined || v === null || v === "");
    if (bad) missing.push(q.id);
  });
  return missing;
}

function buildPayload() {
  var out = {};
  currentQuestions().forEach(function (q) {
    var v = answers[q.id];
    if (q.type === "text") out[q.id] = (v || "").toString();
    else if (v !== undefined && v !== null) out[q.id] = v;
  });
  return { action: "submit", code: CODE, survey: currentSurvey, answers: out };
}

function onSubmit() {
  if (submitting) return;
  var missing = validate();
  if (missing.length) {
    missing.forEach(function (qid) {
      var c = document.getElementById("card-" + qid);
      if (c) c.classList.add("missing");
    });
    var first = document.getElementById("card-" + missing[0]);
    if (first) first.scrollIntoView({ behavior: "smooth", block: "center" });
    toast(missing.length === 1 ? t().missingOne : t().missingToast, true);
    return;
  }
  var payload = buildPayload();

  if (!navigator.onLine) {
    try { localStorage.setItem("pending:" + CODE, JSON.stringify(payload)); } catch (e) {}
    centerScreen("offlineSavedTitle", "offlineSavedBody", true);
    return;
  }
  submitting = true;
  showProgress(false);
  app.innerHTML = '<div class="card center-card"><div class="spinner" aria-hidden="true"></div><h2>' + esc(t().sendingTitle) + '</h2><p>' + esc(t().sendingBody) + '</p></div>';

  postBridge(payload).then(function () {
    /* Opaque response — confirm via re-check after ~1.5s */
    setTimeout(function () {
      checkCode(CODE).then(function (res) {
        submitting = false;
        if (res && res.ok && res.used) {
          try { localStorage.setItem("done:" + CODE, "1"); localStorage.removeItem("pending:" + CODE); } catch (e) {}
        } else {
          /* POST resolved; treat as received even if the re-check lags */
          try { localStorage.setItem("done:" + CODE, "1"); } catch (e) {}
        }
        centerScreen("thanksTitle", "thanksBody", true);
      }).catch(function () {
        submitting = false;
        try { localStorage.setItem("done:" + CODE, "1"); } catch (e) {}
        centerScreen("thanksTitle", "thanksBody", true);
      });
    }, 1500);
  }).catch(function () {
    submitting = false;
    try { localStorage.setItem("pending:" + CODE, JSON.stringify(payload)); } catch (e) {}
    centerScreen("offlineSavedTitle", "offlineSavedBody", true);
  });
}

/* Try to flush a queued submission; resolves true when server confirms used */
function trySendPending(code, payload) {
  if (!navigator.onLine || !SURVEY_API_URL) return Promise.resolve(false);
  return postBridge(payload).then(function () {
    return new Promise(function (resolve) {
      setTimeout(function () {
        checkCode(code).then(function (res) {
          if (res && res.ok && res.used) {
            try { localStorage.setItem("done:" + code, "1"); localStorage.removeItem("pending:" + code); } catch (e) {}
            resolve(true);
          } else resolve(false);
        }).catch(function () { resolve(false); });
      }, 1500);
    });
  }).catch(function () { return false; });
}

window.addEventListener("online", function () {
  if (ADMIN_KEY || !CODE || !SURVEY_API_URL) return;
  var pending = null;
  try { pending = localStorage.getItem("pending:" + CODE); } catch (e) {}
  if (pending) {
    trySendPending(CODE, JSON.parse(pending)).then(function (done) {
      if (done) centerScreen("thanksTitle", "thanksBody", true);
    });
  }
});

      (q.options || []).forEach(function (opt, oi) {
        html += '<div class="opt-editor-row"><div class="opt-row-top"><span>Option ' + (oi + 1) + '</span><button type="button" class="btn btn-danger-ghost btn-small" data-bq-delopt="' + idx + '-' + oi + '">Remove</button></div>'
          + '<input type="text" data-bq-opten="' + idx + '-' + oi + '" placeholder="Option — English" value="' + esc(opt.en) + '" />'
          + '<input type="text" data-bq-optes="' + idx + '-' + oi + '" placeholder="Option — Spanish (optional)" value="' + esc(opt.es) + '" /></div>';
      });
      html += '<button type="button" class="btn btn-ghost btn-small" data-bq-addopt="' + idx + '">+ Add option</button></div>';
    }
    if (q.type === "text") {
      html += '<p class="empty-note" style="margin:4px 0 0;">Written-answer questions are optional for respondents.</p>';
    } else {
      html += '<label class="req-toggle"><input type="checkbox" data-bq-required="' + idx + '"' + (q.required ? " checked" : "") + ' /> Required</label>';
    }
    html += '<div class="builder-actions">'
      + '<button type="button" class="btn btn-ghost btn-small" data-bq-up="' + idx + '"' + (idx === 0 ? " disabled" : "") + '>↑ Move up</button>'
      + '<button type="button" class="btn btn-ghost btn-small" data-bq-down="' + idx + '"' + (idx === builderState.questions.length - 1 ? " disabled" : "") + '>↓ Move down</button>'
      + '<button type="button" class="btn btn-danger-ghost btn-small" data-bq-del="' + idx + '">Remove question</button>'
      + '</div>';
    html += '</div>';
  });
  html += '</div>';
  html += '<button type="button" class="btn btn-ghost" id="bAddQuestion" style="width:100%;">+ Add question</button>';
  html += '<div class="builder-actions" style="margin-top:14px;"><button type="button" class="btn btn-primary" id="bSaveSurvey">Save survey</button><button type="button" class="btn btn-ghost" id="bCancelBuilder">Cancel</button></div>';
  html += '<p class="empty-note">Saving stores the survey on this device. When you assign it, the full survey travels with that person\u2019s link so they see exactly these questions.</p>';
  zone.innerHTML = html;

  zone.querySelectorAll("[data-bq-type]").forEach(function (sel) {
    sel.addEventListener("change", function () {
      var i = parseInt(sel.getAttribute("data-bq-type"), 10);
      var hadRequiredToggle = !!document.querySelector('[data-bq-required="' + i + '"]');
      collectBuilderFromDOM();
      var newType = sel.value;
      builderState.questions[i].type = newType;
      if (newType === "text") builderState.questions[i].required = false;
      else if (!hadRequiredToggle) builderState.questions[i].required = true;
      if ((newType === "single" || newType === "multi2") && (!builderState.questions[i].options || !builderState.questions[i].options.length)) builderState.questions[i].options = [{ en: "", es: "" }, { en: "", es: "" }];
      renderBuilder();
    });
  });
  zone.querySelectorAll("[data-bq-addopt]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      collectBuilderFromDOM();
      var i = parseInt(btn.getAttribute("data-bq-addopt"), 10);
      builderState.questions[i].options.push({ en: "", es: "" });
      renderBuilder();
    });
  });
  zone.querySelectorAll("[data-bq-delopt]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      collectBuilderFromDOM();
      var parts = btn.getAttribute("data-bq-delopt").split("-");
      var i = parseInt(parts[0], 10), oi = parseInt(parts[1], 10);
      builderState.questions[i].options.splice(oi, 1);
      renderBuilder();
    });
  });
  zone.querySelectorAll("[data-bq-del]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      collectBuilderFromDOM();
      var i = parseInt(btn.getAttribute("data-bq-del"), 10);
      builderState.questions.splice(i, 1);
      renderBuilder();
    });
  });
  zone.querySelectorAll("[data-bq-up]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      collectBuilderFromDOM();
      var i = parseInt(btn.getAttribute("data-bq-up"), 10);
      if (i <= 0) return;
      var tmp = builderState.questions[i - 1]; builderState.questions[i - 1] = builderState.questions[i]; builderState.questions[i] = tmp;
      renderBuilder();
    });
  });
  zone.querySelectorAll("[data-bq-down]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      collectBuilderFromDOM();
      var i = parseInt(btn.getAttribute("data-bq-down"), 10);
      if (i >= builderState.questions.length - 1) return;
      var tmp = builderState.questions[i + 1]; builderState.questions[i + 1] = builderState.questions[i]; builderState.questions[i] = tmp;
      renderBuilder();
    });
  });
  var addQ = document.getElementById("bAddQuestion");
  if (addQ) addQ.addEventListener("click", function () { collectBuilderFromDOM(); builderState.questions.push(newBuilderQuestion("likert")); renderBuilder(); });
  var cancelB = document.getElementById("bCancelBuilder");
  if (cancelB) cancelB.addEventListener("click", function () { builderState.open = false; renderBuilder(); });
  var saveB = document.getElementById("bSaveSurvey");
  if (saveB) saveB.addEventListener("click", onSaveCustomSurvey);
}
function onSaveCustomSurvey() {
  collectBuilderFromDOM();
  var titleEn = (builderState.titleEn || "").trim();
  if (!titleEn) { toast("Give the survey a title in English first.", true); var el = document.getElementById("bTitleEn"); if (el) el.focus(); return; }
  if (!builderState.questions.length) { toast("Add at least 1 question before saving.", true); return; }
  for (var i = 0; i < builderState.questions.length; i++) {
    var q = builderState.questions[i];
    if (!(q.textEn || "").trim()) { toast("Question " + (i + 1) + " needs text in English.", true); return; }
    if (q.type === "single" || q.type === "multi2") {
      var validOpts = (q.options || []).filter(function (o) { return (o.en || "").trim(); });
      if (validOpts.length < 2) { toast("Question " + (i + 1) + " needs at least 2 options.", true); return; }
    }
  }
  var definition = {
    id: genCustomId(),
    title: { en: titleEn, es: (builderState.titleEs || "").trim() },
    intro: { en: (builderState.introEn || "").trim(), es: (builderState.introEs || "").trim() },
    questions: builderState.questions.map(function (q) {
      var out = {
        type: q.type,
        text: { en: (q.textEn || "").trim(), es: (q.textEs || "").trim() },
        required: q.type === "text" ? false : !!q.required
      };
      if (q.type === "single" || q.type === "multi2") {
        out.options = (q.options || []).filter(function (o) { return (o.en || "").trim(); }).map(function (o) { return { en: (o.en || "").trim(), es: (o.es || "").trim() }; });
      }
      /* Keep shape order type/text/options/required as in spec example; options only for choice types */
      if (out.options) {
        return { type: out.type, text: out.text, options: out.options, required: out.required };
      }
      return { type: out.type, text: out.text, required: out.required };
    })
  };
  var list = loadLocalCustomSurveys();
  list.push(definition);
  saveLocalCustomSurveys(list);
  builderState = { open: false, titleEn: "", titleEs: "", introEn: "", introEs: "", questions: [] };
  adminState.survey = definition.id;
  renderSurveysList();
  renderSurveyPicker();
  renderBuilder();
  toast("Survey saved: " + titleEn);
}

function restoreCreated() {
  if (adminState.created) showCreated(adminState.created);
}

function genCode() {
  var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  var out = "";
  var buf = new Uint8Array(10);
  if (window.crypto && window.crypto.getRandomValues) {
    window.crypto.getRandomValues(buf);
    for (var i = 0; i < 10; i++) out += chars[buf[i] % chars.length];
  } else {
    for (var j = 0; j < 10; j++) out += chars[Math.floor(Math.random() * chars.length)];
  }
  return out;
}

function pageBaseUrl() {
  /* Personal links always point at the app's published address, so a link
     created from any copy of this page reaches the same live survey. */
  return "https://bluekangaroopackoutzbm.github.io/team-surveys/";
}

function onCreateAssignment() {
  var person = (document.getElementById("personName").value || "").trim();
  if (!person) { toast("Type the person's name or label first.", true); document.getElementById("personName").focus(); return; }
  var btn = document.getElementById("createBtn");
  btn.disabled = true; btn.textContent = "Creating…";
  var code = genCode();
  var payload = { action: "create", key: ADMIN_KEY, person: person, survey: adminState.survey, code: code };
  if (isCustomId(adminState.survey)) {
    var defForAssign = findCustomDefinition(adminState.survey);
    if (!defForAssign) { btn.disabled = false; btn.textContent = "Create personal link"; toast("That custom survey could not be found on this device.", true); return; }
    payload.definition = defForAssign;
  }
  postBridge(payload).then(function () {
    /* Opaque response — the app generated the code, so the link is ready to show */
    var link = pageBaseUrl() + "?code=" + code;
    adminState.created = { person: person, survey: adminState.survey, code: code, link: link, definition: payload.definition || null };
    btn.disabled = false; btn.textContent = "Create personal link";
    showCreated(adminState.created);
    toast("Personal link created for " + person);
    loadAdminData();
  }).catch(function () {
    btn.disabled = false; btn.textContent = "Create personal link";
    toast("Couldn't reach the response inbox. Check your connection and try again.", true);
  });
}

function fillMsg(template, name, link) {
  return template.split("{NAME}").join(name).split("{LINK}").join(link);
}

function showCreated(c) {
  var zone = document.getElementById("createdZone");
  if (!zone) return;
  var templates;
  if (isCustomId(c.survey)) {
    var cdef = findCustomDefinition(c.survey) || (c.definition ? c.definition : null) || { title: { en: c.survey, es: "" } };
    templates = customMessageTemplates(cdef);
  } else {
    templates = ADMIN_MSGS[c.survey];
  }
  var msgEn = fillMsg(templates.en, c.person, c.link);
  var msgEs = fillMsg(templates.es, c.person, c.link);
  zone.innerHTML =
    '<p style="font-weight:900; margin:18px 0 4px;">Personal link for ' + esc(c.person) + ' — ' + esc(surveyDisplayName(c.survey)) + '</p>'
    + '<div class="link-box">' + esc(c.link) + '</div>'
    + '<button type="button" class="btn btn-gold btn-small" id="copyLinkBtn">Copy link</button>'
    + '<div class="msg-label">Message to send — English</div>'
    + '<div class="msg-box">' + esc(msgEn) + '</div>'
    + '<button type="button" class="btn btn-ghost btn-small" data-copymsg="' + esc(msgEn) + '">Copy English message</button>'
    + '<div class="msg-label">Mensaje para enviar — Español</div>'
    + '<div class="msg-box">' + esc(msgEs) + '</div>'
    + '<button type="button" class="btn btn-ghost btn-small" data-copymsg="' + esc(msgEs) + '">Copy Spanish message</button>'
    + '<p class="empty-note" style="margin-top:12px;">This link works one time only. Once ' + esc(c.person) + ' submits, the link locks — and their answers are stored with no name attached.</p>';
  document.getElementById("copyLinkBtn").addEventListener("click", function () { copyText(c.link, "Link copied"); });
  zone.querySelectorAll("[data-copymsg]").forEach(function (b) {
    b.addEventListener("click", function () { copyText(b.getAttribute("data-copymsg"), "Message copied"); });
  });
}

function copyText(text, okMsg) {
  function done() { toast(okMsg); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
  } else fallback();
  function fallback() {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Copy failed — long-press the text to copy it.", true); }
    document.body.removeChild(ta);
  }
}

function loadAdminData() {
  if (!SURVEY_API_URL) return;
  jsonp(SURVEY_API_URL + "?results=" + encodeURIComponent(ADMIN_KEY)).then(function (res) {
    if (!res || !res.ok) {
      var az = document.getElementById("assignZone");
      var rz = document.getElementById("resultsZone");
      if (az) az.innerHTML = '<p class="empty-note">The admin key was not accepted by the response inbox.</p>';
      if (rz) rz.innerHTML = '<p class="empty-note">Results are unavailable.</p>';
      return;
    }
    adminState.data = res;
    if (Array.isArray(res.surveys)) {
      adminState.remoteDefinitions = res.surveys.map(function (s) {
        if (!s) return null;
        var def = s.definition || s;
        if (def && !def.id && s.id) { var copy = {}; for (var k in def) copy[k] = def[k]; copy.id = s.id; return copy; }
        return def;
      }).filter(function (d) { return d && d.id; });
      renderSurveysList();
      renderSurveyPicker();
    }
    renderAssignments(res.assignments || []);
    renderResults(res.responses || []);
  }).catch(function () {
    var az = document.getElementById("assignZone");
    if (az) az.innerHTML = '<p class="empty-note">Couldn\'t load assignments — check your connection and reopen this page.</p>';
  });
}

function renderAssignments(list) {
  var zone = document.getElementById("assignZone");
  if (!zone) return;
  if (!list.length) { zone.innerHTML = '<p class="empty-note">No assignments yet. Create the first personal link above.</p>'; return; }
  var html = "";
  list.forEach(function (a) {
    html += '<div class="assign-row"><div class="who"><div class="nm">' + esc(a.person) + '</div>'
      + '<div class="tp">' + esc(surveyDisplayName(a.survey)) + '</div></div>'
      + '<span class="status-pill ' + (a.used ? "done" : "waiting") + '">' + (a.used ? "Completed" : "Waiting") + '</span>'
      + (a.code ? '<button type="button" class="btn btn-danger-ghost btn-small" data-remove-code="' + esc(a.code) + '">' + esc(t().removePerson) + '</button>' : '')
      + '</div>';
  });
  zone.innerHTML = html;
  zone.querySelectorAll("[data-remove-code]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var code = btn.getAttribute("data-remove-code");
      var found = null;
      list.forEach(function (x) { if (x.code === code) found = x; });
      if (found) showRemoveConfirm(found);
    });
  });
}

function showRemoveConfirm(a) {
  var old = document.getElementById("removeModal");
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var wrap = document.createElement("div");
  wrap.id = "removeModal";
  wrap.className = "modal-overlay";
  wrap.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true">'
    + '<p class="modal-q">' + esc(t().removeQPre + a.person + t().removeQPost) + '</p>'
    + '<p class="modal-body">' + esc(t().removeBody) + '</p>'
    + (a.used ? '<p class="modal-body">' + esc(t().removeBodyDone) + '</p>' : '')
    + '<div class="modal-actions">'
    + '<button type="button" class="btn btn-ghost" id="rmCancelBtn">' + esc(t().removeCancel) + '</button>'
    + '<button type="button" class="btn btn-danger" id="rmConfirmBtn">' + esc(t().removePerson) + '</button>'
    + '</div></div>';
  document.body.appendChild(wrap);
  function close() { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
  document.getElementById("rmCancelBtn").addEventListener("click", close);
  document.getElementById("rmConfirmBtn").addEventListener("click", function () {
    var rb = document.getElementById("rmConfirmBtn");
    var cb = document.getElementById("rmCancelBtn");
    rb.disabled = true;
    if (cb) cb.disabled = true;
    postBridge({ action: "delete", key: ADMIN_KEY, code: a.code }).then(function () {
      close();
      toast(t().removeDone);
      loadAdminData();
    }).catch(function () {
      close();
      toast(t().removeFailed, true);
    });
  });
}

function renderResults(responses) {
  var zone = document.getElementById("resultsZone");
  if (!zone) return;
  var html = "";
  /* Collect survey ids to render: built-ins + custom ids seen in responses, assignments data, or merged definitions that have responses */
  var customIds = [];
  var seenCustom = {};
  function addCustomId(id) { if (isCustomId(id) && !seenCustom[id]) { seenCustom[id] = true; customIds.push(id); } }
  responses.forEach(function (r) { addCustomId(r.survey); });
  if (adminState.data && Array.isArray(adminState.data.assignments)) adminState.data.assignments.forEach(function (a) { /* only show custom in results if it has responses or a definition; keep list from responses primarily */ });
  getMergedCustomSurveys().forEach(function (def) {
    var hasResp = responses.some(function (r) { return r.survey === def.id; });
    if (hasResp) addCustomId(def.id);
  });
  var allIds = ["crew", "exit"].concat(customIds);
  allIds.forEach(function (sid) {
    var rs = responses.filter(function (r) { return r.survey === sid; });
    var title = surveyDisplayName(sid);
    html += '<h4 style="font-size:16.5px; font-weight:900; margin:18px 0 4px;">' + esc(title) + ' — ' + rs.length + (rs.length === 1 ? " response" : " responses") + '</h4>';

    if (sid === "exit" && rs.length < 3) {
      html += '<div class="lock-note">Exit survey: ' + rs.length + ' response' + (rs.length === 1 ? "" : "s") + ' so far — details unlock at 3 responses, to protect such a small group.</div>';
      return;
    }
    if (!rs.length) { html += '<p class="empty-note">No responses yet.</p>'; return; }

    var qsForSurvey;
    if (isCustomId(sid)) {
      var cdef = findCustomDefinition(sid);
      if (!cdef) { html += '<p class="empty-note">Survey definition not available on this device yet — it will appear once an assignment for it loads from the inbox.</p>'; return; }
      qsForSurvey = normalizedQuestionsFromDefinition(cdef);
    } else {
      qsForSurvey = allQuestions(sid);
    }
    qsForSurvey.forEach(function (q) {
      if (q.type === "text") return; /* open text is never displayed */
      html += '<div class="result-q"><p class="rq-text">' + q.id.replace("q", "") + '. ' + esc(q.text.en) + '</p>';
      if (q.type === "likert") {
        var counts = [0, 0, 0, 0, 0], sum = 0, n = 0;
        rs.forEach(function (r) {
          var v = r.answers ? r.answers[q.id] : undefined;
          if (v >= 1 && v <= 5) { counts[v - 1]++; sum += v; n++; }
        });
        var avg = n ? (sum / n).toFixed(1) : "—";
        html += '<div class="rq-avg">Average: ' + avg + ' / 5 · ' + n + ' answered</div>';
        html += '<div class="dist">'
          + counts.map(function (c, i) {
              var w = n ? (c / n) * 100 : 0;
              return '<div class="d' + (i + 1) + '" style="width:' + w + '%"></div>';
            }).join("")
          + '</div><div class="dist-legend">' + counts.map(function (c, i) { return "<span>" + (i + 1) + ": " + c + "</span>"; }).join("") + '</div>';
      } else {
        var opts = q.options.en;
        var ocounts = opts.map(function () { return 0; });
        rs.forEach(function (r) {
          var v = r.answers ? r.answers[q.id] : undefined;
          if (q.type === "picktwo" && Array.isArray(v)) v.forEach(function (i) { if (ocounts[i] !== undefined) ocounts[i]++; });
          else if (q.type === "single" && typeof v === "number" && ocounts[v] !== undefined) ocounts[v]++;
        });
        var max = Math.max.apply(null, ocounts.concat([1]));
        opts.forEach(function (opt, i) {
          html += '<div class="opt-row"><span class="opt-name">' + esc(opt) + '</span><span class="opt-bar"><div style="width:' + (ocounts[i] / max) * 100 + '%"></div></span><span class="opt-count">' + ocounts[i] + '</span></div>';
        });
      }
      html += '</div>';
    });
  });
  html += '<div class="protect-note">Written answers are not shown here. They are summarized for Juan in paraphrased form only, so no respondent can be recognized by their writing.</div>';
  zone.innerHTML = html;
}

/* ---------------- Boot ---------------- */
init();
</script>
